<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Tailwind · Magdalena</title>
<link rel="icon" href="../assets/favicon/favicon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<!-- Tailwind v3 Play CDN (solo demostraciones). En producción use el preset: dist/tailwind/magdalena.tailwind.preset.cjs -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Mismo contenido que el preset, resumido para el CDN de demostración
  tailwind.config = { theme: { extend: {
    colors: {
      'mg-primary': { 50:'#EBF4FA',100:'#D6E8F4',200:'#ADD2E9',300:'#80B8DD',400:'#4094CC',500:'#0071BB',600:'#006199',700:'#004F82',800:'#003D66',900:'#002B4A',DEFAULT:'#0071BB' },
      'mg-cyan': { 50:'#E6F8FB',100:'#CCF1F8',200:'#99E3F1',300:'#66D5EA',400:'#33C6E2',500:'#00B7D9',DEFAULT:'#00B7D9',700:'#007A91',800:'#00566A' },
      'mg-sky': { DEFAULT:'#9FD7E5', 200:'#CFEBF2' }, 'mg-red': { DEFAULT:'#F7003C' }, 'mg-yellow': { DEFAULT:'#FEC800' }, 'mg-green': { DEFAULT:'#69B75E' }, 'mg-ink':'#1D1D1B', 'mg-surface':'#F6F5F5',
    },
    backgroundImage: {
      'mg-grad-primary': 'linear-gradient(135deg, #0071BB 0%, #00B7D9 100%)',
      'mg-grad-sky': 'linear-gradient(135deg, #0071BB 0%, #00B7D9 55%, #9FD7E5 100%)',
      'mg-grad-action': 'linear-gradient(135deg, #0071BB 0%, #00A1CF 100%)',
      'mg-grad-stripe': 'linear-gradient(90deg,#5618BA 0 11.1%,#A28034 0 22.2%,#FEC800 0 33.3%,#F7003C 0 44.4%,#0071BB 0 55.6%,#00B7D9 0 66.7%,#9FD7E5 0 77.8%,#69B75E 0 88.9%,#5618BA 0 100%)',
    },
    fontFamily: { sans: ['Montserrat','Gotham','system-ui','sans-serif'] },
    boxShadow: { 'mg-md': '0 4px 10px rgba(0,56,94,.10), 0 2px 4px rgba(0,56,94,.06)', 'mg-lg': '0 14px 30px rgba(0,56,94,.14), 0 4px 10px rgba(0,56,94,.08)' },
    borderRadius: { 'mg-lg': '16px' },
  } } };
</script>
</head>
<body class="bg-mg-surface font-sans text-mg-ink">
<header class="bg-white shadow-mg-md"><div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-3">
  <img src="../assets/logos/svg/logo-horizontal-color.svg" class="h-11" alt="Gobernación del Magdalena">
  <a href="../index.html" class="rounded-full bg-mg-grad-action px-5 py-2 font-bold text-white">Manual de marca</a></div><div class="h-1.5 bg-mg-grad-stripe"></div></header>
<section class="bg-mg-grad-sky text-white"><div class="mx-auto max-w-6xl px-5 py-16"><h1 class="text-4xl font-black md:text-5xl">Tailwind con la marca Magdalena</h1><p class="mt-3 max-w-xl text-lg">Colores mg-*, degradados bg-mg-grad-* y la línea multicolor como utilidades.</p>
  <button class="mt-6 rounded-full bg-mg-yellow px-6 py-3 font-bold text-mg-ink shadow-mg-md">Ver trámites</button></div><div class="h-2.5 bg-mg-grad-stripe"></div></section>
<main class="mx-auto grid max-w-6xl gap-6 px-5 py-12 md:grid-cols-3">
  <article class="overflow-hidden rounded-mg-lg bg-white shadow-mg-md"><div class="h-1.5 bg-mg-grad-stripe"></div><div class="p-6"><h3 class="text-xl font-extrabold text-mg-primary-700">Tarjeta con la línea</h3><p class="mt-2 text-gray-600">bg-mg-grad-stripe</p></div></article>
  <article class="rounded-mg-lg bg-mg-grad-primary p-6 text-white shadow-mg-lg"><h3 class="text-xl font-extrabold">Degradado azul</h3><p class="mt-2">bg-mg-grad-primary</p></article>
  <article class="rounded-mg-lg border-l-8 border-mg-cyan bg-white p-6 shadow-mg-md"><h3 class="text-xl font-extrabold">Borde de acento</h3><p class="mt-2"><span class="rounded-full bg-mg-cyan-100 px-3 py-1 text-sm font-bold text-mg-cyan-800">Etiqueta</span></p></article>
</main>
</body>
</html>
